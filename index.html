<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSINT Детектив</title>
    <!-- Подключаем официальный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #17212b);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #5288c1);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #232e3c);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .card {
            background-color: var(--secondary-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }
        .hidden { display: none; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; }
        .clue { margin-top: 10px; padding: 10px; border-left: 4px solid var(--button-color); background: rgba(255,255,255,0.05); border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Экран 1: Главное меню -->
    <div id="screen-home">
        <h1>🕵️ OSINT Детектив</h1>
        <div class="card">
            <div class="stats">
                <span id="money-display">💰 0 ₽</span>
                <span id="rep-display">⭐ 0</span>
            </div>
            <p>Ты — начинающий аналитик. Бери кейсы, ищи улики, зарабатывай.</p>
        </div>
        <button class="btn" onclick="startCase()">Взять кейс №1</button>
    </div>

    <!-- Экран 2: Кейс -->
    <div id="screen-case" class="hidden">
        <h1>Кейс: Пропавшая Инга</h1>
        <div class="card">
            <p>Клиент: «Моя сестра Инга не выходит на связь 3 дня. Писала, что поехала на встречу с подругой из интернета. Ник: @inga_star_. Помогите!»</p>
        </div>
        
        <div id="clues-container"></div>

        <button class="btn" id="clue-btn" onclick="findClue()">🔍 Искать улики</button>
        <button class="btn hidden" id="solve-btn" onclick="solveCase()" style="background-color: #4caf50;">✅ Сдать отчёт (Café Luna)</button>
        <button class="btn" onclick="goHome()" style="background-color: transparent; border: 1px solid var(--button-color); color: var(--button-color);">Назад</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Данные игрока (пока храним в памяти браузера)
        let player = {
            money: 0,
            reputation: 0,
            caseProgress: 0
        };

        // Улики для кейса
        const clues = [
            "📱 Профиль @inga_star_: 12 фото, био «люблю кофе».",
            "🖼 На последнем фото видна вывеска «Café Luna».",
            "💬 Переписка: подруга зовет в «обычное место».",
            "👤 Аккаунт подруги создан 5 дней назад, 0 друзей. Это бот!"
        ];

        function updateUI() {
            document.getElementById('money-display').innerText = `💰 ${player.money} ₽`;
            document.getElementById('rep-display').innerText = `⭐ ${player.reputation}`;
        }

        function startCase() {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-case').classList.remove('hidden');
            player.caseProgress = 0;
            document.getElementById('clues-container').innerHTML = '';
            document.getElementById('clue-btn').classList.remove('hidden');
            document.getElementById('solve-btn').classList.add('hidden');
        }

        function findClue() {
            if (player.caseProgress < clues.length) {
                const div = document.createElement('div');
                div.className = 'clue';
                div.innerText = clues[player.caseProgress];
                document.getElementById('clues-container').appendChild(div);
                player.caseProgress++;

                // Если нашли все улики, показываем кнопку решения
                if (player.caseProgress === clues.length) {
                    document.getElementById('clue-btn').classList.add('hidden');
                    document.getElementById('solve-btn').classList.remove('hidden');
                }
            }
        }

        function solveCase() {
            player.money += 500;
            player.reputation += 10;
            updateUI();
            tg.showAlert("Отлично, детектив! Ты вычислил бота. Награда: 500 ₽ и 10 репутации.");
            goHome();
        }

        function goHome() {
            document.getElementById('screen-case').classList.add('hidden');
            document.getElementById('screen-home').classList.remove('hidden');
        }

        updateUI();
    </script>
</body>
</html>
