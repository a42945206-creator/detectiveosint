<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSINT Detective</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #0f172a);
            --text: var(--tg-theme-text-color, #f8fafc);
            --hint: var(--tg-theme-hint-color, #94a3b8);
            --btn: var(--tg-theme-button-color, #3b82f6);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --danger: #ef4444;
            --success: #22c55e;
            --link: #60a5fa;
            --gold: #fbbf24;
            --purple: #a855f7;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Вкладки контента */
        .content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; }
        
        /* Навигация снизу */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--card-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); z-index: 90; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--hint); font-size: 11px; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: var(--btn); }
        .nav-icon { font-size: 22px; margin-bottom: 3px; }

        /* Карточки */
        .card { background: var(--card-bg); padding: 16px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-bottom: 15px; line-height: 1.5; border: 1px solid rgba(255,255,255,0.05); }
        
        /* Кнопки */
        .btn { background: var(--btn); color: var(--btn-text); border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: transform 0.1s; margin-bottom: 10px; }
        .btn:active { transform: scale(0.97); }
        .btn-outline { background: transparent; border: 2px solid var(--btn); color: var(--btn); }
        .btn-success { background: var(--success); color: white; }
        .btn-purple { background: var(--purple); color: white; }
        .btn-disabled { background: #334155; color: #64748b; pointer-events: none; }
        
        /* Заголовки */
        h1, h2, h3 { margin: 0 0 12px 0; font-weight: 700; }
        .category-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; background: rgba(59, 130, 246, 0.2); color: var(--link); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Прогресс */
        .progress-bar { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: var(--purple); width: 0%; transition: width 0.5s; }

        /* Внутренний браузер */
        .app-header { display: flex; align-items: center; margin-bottom: 15px; gap: 10px; }
        .back-btn { background: transparent; border: none; color: var(--link); font-size: 24px; cursor: pointer; padding: 0; }
        .app-content { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px; }
        
        .interactive { cursor: pointer; border-bottom: 1px dashed var(--link); color: var(--link); display: inline-block; }
        .interactive.found { color: var(--hint); border-bottom: none; text-decoration: line-through; pointer-events: none; }

        /* Блокнот */
        .notebook-toggle { position: fixed; bottom: 80px; right: 16px; width: 56px; height: 56px; border-radius: 28px; background: var(--purple); color: white; border: none; font-size: 22px; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); z-index: 51; display: none; justify-content: center; align-items: center; }
        .clue-item { font-size: 13px; margin-bottom: 6px; color: var(--success); background: rgba(34, 197, 94, 0.1); padding: 8px; border-radius: 6px; }

        /* Модалки */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal { background: var(--card-bg); padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; transform: scale(0.9); transition: 0.3s; }
        .modal-overlay.active .modal { transform: scale(1); }

        .fake-photo { width: 100%; height: 160px; background: #222; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #444; margin-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="content" id="main-content">
        <!-- Содержимое вкладок рендерится здесь -->
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('cases', this)">
            <div class="nav-icon">🗂️</div>
            <div>Кейсы</div>
        </div>
        <div class="nav-item" onclick="switchTab('shop', this)">
            <div class="nav-icon">🛒</div>
            <div>Магазин</div>
        </div>
        <div class="nav-item" onclick="switchTab('profile', this)">
            <div class="nav-icon">👤</div>
            <div>Профиль</div>
        </div>
    </div>

    <button class="notebook-toggle" id="notebook-btn" onclick="toggleNotebook()">📓</button>

    <!-- Модалки -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>

    <script src="cases.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        // Игрок
        let player = JSON.parse(localStorage.getItem('osint_player_v2')) || { 
            money: 1000, // Дадим немного на старт
            reputation: 0, 
            stars: 0,
            level: 1,
            tools: [],
            completedCases: [] 
        };

        let currentTab = 'cases';
        let activeCase = null;
        let foundClues = new Set();

        function save() { localStorage.setItem('osint_player_v2', JSON.stringify(player)); }

        // --- РЕНДЕР ВКЛАДОК ---
        function render() {
            const content = document.getElementById('main-content');
            
            if (currentTab === 'cases') {
                content.innerHTML = `
                    <h1>🗂️ База кейсов</h1>
                    <div class="card">
                        <h3>Твой уровень: ${player.level}</h3>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${(player.completedCases.length % 5) * 20}%"></div></div>
                        <p style="font-size:12px; color:var(--hint); margin-top:5px;">До следующего уровня: ${5 - (player.completedCases.length % 5)} кейсов</p>
                    </div>
                    ${CASES.map(c => {
                        const isDone = player.completedCases.includes(c.id);
                        return `
                        <div class="card" style="opacity: ${isDone ? '0.6' : '1'};">
                            <span class="category-badge">${c.category}</span> • <span style="font-size:12px; color:var(--hint);">${c.difficulty}</span>
                            <h3>${c.title}</h3>
                            <p style="font-size:13px; color:var(--hint);">Награда: ${c.reward.money} ₽, ${c.reward.rep} Rep, ${c.reward.stars} ⭐</p>
                            <button class="btn ${isDone ? 'btn-disabled' : ''}" onclick="startCase(${c.id})">${isDone ? '✅ Пройден' : 'Начать расследование'}</button>
                        </div>
                        `;
                    }).join('')}
                `;
            } 
            else if (currentTab === 'shop') {
                content.innerHTML = `
                    <h1>🛒 Магазин тулзов</h1>
                    <div class="card">
                        <h3>🧠 Анти-бот (1000 ₽)</h3>
                        <p style="font-size:12px; color:var(--hint);">Помогает выявлять фейки.</p>
                        <button class="btn ${player.tools.includes('Анти-бот') ? 'btn-disabled' : ''}" onclick="buyTool('Анти-бот', 1000)">
                            ${player.tools.includes('Анти-бот') ? '✅ Куплено' : 'Купить'}
                        </button>
                    </div>
                    <div class="card">
                        <h3>🖼 Reverse Image (1500 ₽)</h3>
                        <p style="font-size:12px; color:var(--hint);">Ищет источник фото.</p>
                        <button class="btn ${player.tools.includes('Reverse Image') ? 'btn-disabled' : ''}" onclick="buyTool('Reverse Image', 1500)">
                            ${player.tools.includes('Reverse Image') ? '✅ Куплено' : 'Купить'}
                        </button>
                    </div>
                `;
            }
            else if (currentTab === 'profile') {
                content.innerHTML = `
                    <h1>👤 Профиль агента</h1>
                    <div class="card" style="text-align:center;">
                        <div style="font-size:60px; margin-bottom:10px;">🕵️</div>
                        <h2>Агент #${tg.initDataUnsafe?.user?.id || '007'}</h2>
                        <p style="color:var(--purple); font-weight:bold;">Звание: ${player.level < 5 ? 'Стажер' : player.level < 10 ? 'Аналитик' : 'Специалист'}</p>
                    </div>
                    <div class="card">
                        <h3>📊 Статистика</h3>
                        <p>Баланс: <b>${player.money} ₽</b></p>
                        <p>Репутация: <b>${player.reputation}</b></p>
                        <p>Звезды: <b>${player.stars} ⭐</b></p>
                        <p>Кейсов закрыто: <b>${player.completedCases.length}</b></p>
                    </div>
                    <div class="card">
                        <h3>🧰 Инвентарь</h3>
                        <p>${player.tools.length ? player.tools.join(', ') : 'Пусто'}</p>
                    </div>
                `;
            }
        }

        function switchTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            render();
            document.getElementById('notebook-btn').style.display = 'none'; // Скрываем блокнот при смене вкладки
        }

        // --- ЛОГИКА КЕЙСА ---
        function startCase(id) {
            activeCase = CASES.find(c => c.id === id);
            foundClues.clear();
            
            document.getElementById('main-content').innerHTML = `
                <div class="app-header">
                    <button class="back-btn" onclick="currentTab='cases'; render();">←</button>
                    <h2>${activeCase.title}</h2>
                </div>
                <div class="card">
                    <span class="category-badge">${activeCase.category}</span>
                    <p style="font-size:14px;">${activeCase.brief}</p>
                </div>
                <div id="browser-view" class="hidden">
                    <div class="app-content" id="browser-content"></div>
                </div>
                <div id="finish-section" class="hidden" style="margin-top:20px;">
                    <button class="btn btn-success" onclick="openReport()">📝 Сдать отчёт</button>
                </div>
            `;
            document.getElementById('notebook-btn').style.display = 'flex';
            document.getElementById('notebook-btn').innerText = `📓 ${foundClues.size}`;
        }

        function showBrowser(html) {
            document.getElementById('browser-content').innerHTML = html;
            document.getElementById('browser-view').classList.remove('hidden');
        }

        function addClue(text) {
            if (foundClues.has(text)) return;
            foundClues.add(text);
            
            document.getElementById('notebook-btn').innerText = `📓 ${foundClues.size}`;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            
            if (foundClues.size >= 1) { // Если нашли хотя бы 1 улику, разрешаем сдавать
                document.getElementById('finish-section').classList.remove('hidden');
            }
        }

        function toggleNotebook() {
            const modal = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            content.innerHTML = `
                <h2>📓 Твои улики</h2>
                <div style="margin-bottom:15px;">
                    ${Array.from(foundClues).map(c => `<div class="clue-item">✅ ${c}</div>`).join('') || '<p>Улик пока нет...</p>'}
                </div>
                <button class="btn" onclick="document.getElementById('modal-overlay').classList.remove('active')">Закрыть</button>
            `;
            modal.classList.add('active');
        }

        // --- СДАЧА ОТЧЕТА ---
        function openReport() {
            const modal = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            content.innerHTML = `
                <h2>📝 Сдача отчёта</h2>
                <p style="font-size:14px; margin-bottom:15px;">${activeCase.questions[0].text}</p>
                <div style="display:flex; flex-direction:column; gap:10px;">
                    ${activeCase.questions[0].answers.map(a => `
                        <button class="btn ${a.correct ? 'btn-success' : 'btn-outline'}" onclick="submitAnswer(${a.correct})">${a.t}</button>
                    `).join('')}
                </div>
                <button class="btn" style="background:transparent; color:var(--hint); margin-top:10px;" onclick="document.getElementById('modal-overlay').classList.remove('active')">Отмена</button>
            `;
            modal.classList.add('active');
        }

        function submitAnswer(isCorrect) {
            const modal = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            if (isCorrect) {
                player.money += activeCase.reward.money;
                player.reputation += activeCase.reward.rep;
                player.stars += activeCase.reward.stars;
                if (!player.completedCases.includes(activeCase.id)) {
                    player.completedCases.push(activeCase.id);
                    // Повышение уровня каждые 5 кейсов
                    if (player.completedCases.length % 5 === 0) player.level++;
                }
                save();
                
                content.innerHTML = `
                    <div style="text-align:center;">
                        <h1 style="color:var(--success); font-size:50px; margin:0;">✅</h1>
                        <h2>Кейс закрыт!</h2>
                        <p>Ты заработал:<br><b>+${activeCase.reward.money} ₽</b><br><b>+${activeCase.reward.rep} Rep</b><br><b>+${activeCase.reward.stars} ⭐</b></p>
                        <button class="btn" style="margin-top:15px;" onclick="document.getElementById('modal-overlay').classList.remove('active'); currentTab='cases'; render();">Продолжить</button>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div style="text-align:center;">
                        <h1 style="color:var(--danger); font-size:50px; margin:0;">❌</h1>
                        <h2>Ошибка</h2>
                        <p>Ты сделал неверный вывод. Вернись к уликам и подумай еще раз.</p>
                        <button class="btn btn-outline" style="margin-top:15px;" onclick="document.getElementById('modal-overlay').classList.remove('active')">Вернуться</button>
                    </div>
                `;
            }
        }

        function buyTool(name, price) {
            if (player.money >= price) {
                player.money -= price;
                player.tools.push(name);
                save();
                render();
                tg.showAlert(`Куплено: ${name}`);
            } else {
                tg.showAlert("Недостаточно средств!");
            }
        }

        // Инициализация
        render();
    </script>
</body>
</html>
