<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OSINT: Shadow Protocol</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #03050a;
  --card: rgba(8, 12, 22, 0.92);
  --border: rgba(0, 255, 200, 0.15);
  --primary: #00ffc8;
  --primary-dim: rgba(0, 255, 200, 0.12);
  --danger: #ff2a6d;
  --success: #00f5a0;
  --gold: #ffd700;
  --text: #e8f0ff;
  --muted: #5a6a85;
  --glow: 0 0 20px rgba(0, 255, 200, 0.25);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  margin: 0;
  padding: 0;
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  user-select: none;
}

body {
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background-image: 
    radial-gradient(ellipse at 20% 20%, rgba(0, 255, 200, 0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(255, 42, 109, 0.03) 0%, transparent 50%),
    linear-gradient(rgba(0, 255, 200, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 200, 0.02) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
}

.content {
  flex: 1;
  overflow-y: auto;
  padding: 18px 16px 95px;
  scroll-behavior: smooth;
}

.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 74px;
  background: rgba(3, 5, 10, 0.94);
  backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.6px;
  padding: 8px 14px;
  border-radius: 14px;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

.nav-item.active {
  color: var(--primary);
  transform: translateY(-5px);
  text-shadow: 0 0 12px rgba(0, 255, 200, 0.5);
}

.nav-icon { font-size: 20px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(16px);
  transition: transform 0.2s, box-shadow 0.2s;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  opacity: 0.4;
}

.card:active { transform: scale(0.985); }

.card.threat-high {
  border-color: rgba(255, 42, 109, 0.35);
  box-shadow: 0 0 30px rgba(255, 42, 109, 0.08);
}

.card.story {
  border-color: rgba(255, 215, 0, 0.3);
  box-shadow: 0 0 30px rgba(255, 215, 0, 0.08);
}

.btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.btn-primary {
  background: linear-gradient(135deg, #00ffc8, #00b4ff);
  color: #000;
  box-shadow: 0 4px 20px rgba(0, 255, 200, 0.25);
}

.btn-danger {
  background: linear-gradient(135deg, #ff2a6d, #ff5500);
  color: white;
  box-shadow: 0 4px 20px rgba(255, 42, 109, 0.3);
}

.btn-outline {
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--text);
}

.btn-gold {
  background: linear-gradient(135deg, #ffd700, #ffaa00);
  color: #000;
}

.btn:active { transform: scale(0.96); }
.btn:disabled, .btn.disabled {
  background: #111;
  color: #444;
  box-shadow: none;
  pointer-events: none;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.7px;
  text-transform: uppercase;
}

.badge-cyan { background: var(--primary-dim); color: var(--primary); border: 1px solid rgba(0,255,200,0.25); }
.badge-red { background: rgba(255,42,109,0.12); color: var(--danger); border: 1px solid rgba(255,42,109,0.25); }
.badge-gold { background: rgba(255,215,0,0.12); color: var(--gold); border: 1px solid rgba(255,215,0,0.25); }

.progress {
  height: 6px;
  background: #0a0f18;
  border-radius: 4px;
  overflow: hidden;
  margin-top: 8px;
}
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #00b4ff);
  border-radius: 4px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 12px var(--primary);
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.back {
  background: none;
  border: none;
  color: var(--primary);
  font-size: 24px;
  cursor: pointer;
  text-shadow: 0 0 10px var(--primary);
}

.terminal {
  background: #000;
  border: 1px solid #1a1a1a;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 14px;
  font-family: 'Courier New', monospace;
}
.terminal-bar {
  background: #0d0d0d;
  padding: 9px 14px;
  display: flex;
  gap: 6px;
  border-bottom: 1px solid #1a1a1a;
}
.dot { width: 9px; height: 9px; border-radius: 50%; }
.terminal-body {
  padding: 14px;
  font-size: 12.5px;
  line-height: 1.6;
  color: #aaa;
  min-height: 60px;
}
.t-green { color: var(--primary); }
.t-red { color: var(--danger); }

.interactive {
  color: var(--primary);
  border-bottom: 1px dashed var(--primary);
  font-weight: 700;
  cursor: pointer;
  transition: 0.15s;
}
.interactive:active { background: rgba(0,255,200,0.15); }

.notebook-btn {
  position: fixed;
  bottom: 90px;
  right: 16px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--primary);
  color: var(--primary);
  font-size: 20px;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 60;
  box-shadow: var(--glow);
  backdrop-filter: blur(12px);
  transition: transform 0.2s;
}
.notebook-btn:active { transform: scale(0.9); }

.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
}
.modal-bg.active {
  opacity: 1;
  pointer-events: all;
}
.modal {
  background: #070b14;
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 24px;
  width: 100%;
  max-width: 370px;
  max-height: 85vh;
  overflow-y: auto;
  transform: scale(0.88) translateY(20px);
  transition: 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 0 60px rgba(0, 255, 200, 0.1);
}
.modal-bg.active .modal {
  transform: scale(1) translateY(0);
}

.minigame {
  background: #000;
  border: 1px solid var(--primary);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.radar {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: 1px solid rgba(0,255,200,0.3);
  margin: 16px auto;
  position: relative;
  background: radial-gradient(circle, rgba(0,255,200,0.05) 0%, transparent 70%);
}
.radar::before {
  content: '';
  position: absolute;
  inset: 20px;
  border-radius: 50%;
  border: 1px solid rgba(0,255,200,0.15);
}
.radar::after {
  content: '';
  position: absolute;
  inset: 40px;
  border-radius: 50%;
  border: 1px solid rgba(0,255,200,0.1);
}
.radar-sweep {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 50%;
  height: 2px;
  background: linear-gradient(90deg, var(--primary), transparent);
  transform-origin: left center;
  animation: sweep 2.5s linear infinite;
}
@keyframes sweep {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.radar-blip {
  position: absolute;
  width: 8px;
  height: 8px;
  background: var(--primary);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--primary);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.6; }
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin: 14px 0;
}
.cell {
  aspect-ratio: 1;
  background: #0a0f18;
  border: 1px solid #1a2030;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.15s;
}
.cell:active { background: rgba(0,255,200,0.15); }
.cell.correct { background: var(--success); color: #000; }
.cell.wrong { background: var(--danger); color: #fff; }

.timer {
  height: 4px;
  background: #111;
  border-radius: 2px;
  margin-bottom: 14px;
  overflow: hidden;
}
.timer-bar {
  height: 100%;
  background: var(--danger);
  width: 100%;
  transition: width 0.1s linear;
}

.chat {
  text-align: left;
  margin-bottom: 12px;
}
.bubble {
  background: #111827;
  padding: 11px 13px;
  border-radius: 12px;
  margin-bottom: 8px;
  font-size: 13px;
  line-height: 1.4;
}
.bubble.bot { border-left: 3px solid var(--danger); }
.bubble.me { border-left: 3px solid var(--primary); background: #0c1220; }

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}
.stat {
  background: rgba(0,0,0,0.4);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
}
.stat .icon { font-size: 18px; display: block; margin-bottom: 2px; }
.stat .val { font-size: 14px; font-weight: 800; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade { animation: fadeUp 0.4s ease-out forwards; }

@keyframes glitch {
  0% { transform: translate(0); }
  20% { transform: translate(-3px, 2px); }
  40% { transform: translate(3px, -2px); }
  60% { transform: translate(-2px, -1px); }
  80% { transform: translate(2px, 1px); }
  100% { transform: translate(0); }
}
.glitch { animation: glitch 0.3s ease; }

.clue-item {
  background: rgba(0, 245, 160, 0.08);
  border-left: 3px solid var(--success);
  padding: 11px 13px;
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--success);
  display: flex;
  align-items: center;
  gap: 8px;
}

.deduction-card {
  background: #0a0f18;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: 0.2s;
  text-align: left;
}
.deduction-card:active { transform: scale(0.98); }
.deduction-card.selected {
  border-color: var(--primary);
  background: rgba(0, 255, 200, 0.08);
  box-shadow: 0 0 12px rgba(0, 255, 200, 0.15);
}

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="content" id="app"></div>

<div class="nav">
  <div class="nav-item active" onclick="App.tab('cases', this)">
    <div class="nav-icon">🗂️</div>
    <div>КЕЙСЫ</div>
  </div>
  <div class="nav-item" onclick="App.tab('shop', this)">
    <div class="nav-icon">🛒</div>

  <div class="nav-item" onclick="App.tab('agent', this)">

  </div>
</div>

<button class="notebook-btn" id="nb" onclick="App.notebook()">📓</button>

<div class="modal-bg" id="modal">
  <div class="modal" id="modal-body"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
if (tg.setHeaderColor) tg.setHeaderColor('#03050a');

const S = {
  p: JSON.parse(localStorage.getItem('shadow_v4')) || {
    money: 1200, rep: 0, stars: 0, level: 1, tools: [], done: [], base: 0, story: 0, clues: 0, ach: []
  },
  case: null,
  found: new Set(),
  tab: 'cases',
  cases: [],
  stories: [],

  save() { localStorage.setItem('shadow_v4', JSON.stringify(this.p)); },
  has(t) { return this.p.tools.includes(t); }
};

const CITIES = ["Токио","Лондон","Нью-Йорк","Дубай","Сингапур","Париж","Москва","Сеул","Берлин","Стамбул","Гонконг","Сидней"];
const PLANES = ["F-22 Raptor","Су-57","B-2 Spirit","F-35","Ту-160","J-20","Rafale","Eurofighter"];
const NAMES = ["Алекс","Мария","Джон","Сара","Иван","Чен","Лиза","Макс","Юля","Даниил"];

const TOOLS = {
  "Гео-модуль": { price: 1800, desc: "Подсказка сектора + радар", icon: "🗺" },
  "Анти-бот": { price: 2200, desc: "Показывает вероятность бота", icon: "🧠" },
  "Декодер": { price: 2800, desc: "Автоматически находит 1 улику", icon: "🔓" },
  "Стелс-пакет": { price: 3500, desc: "Снижает штраф за ошибку", icon: "🕶" }
};

function makeCase(id) {
  const cats = ["GEOINT","IMINT","HUMINT","OSINT"];
  const cat = cats[id % 4];
  const diff = id > 60 ? "PRO" : id > 25 ? "MID" : "EASY";
  const clues = diff === "PRO" ? 5 : diff === "MID" ? 4 : 3;

  let title, brief, q, correct, fakes, clueList;

  if (cat === "GEOINT") {
    const city = CITIES[id % CITIES.length];
    title = `GEOINT · Сектор ${String(id).padStart(3,"0")}`;
    brief = `Спутник зафиксировал аномалию. Активируй <span class="interactive" onclick="MG.geo('${city}', ${clues})">сканирование</span> и определи точку.`;
    q = "Город объекта?";
    correct = city;
    fakes = CITIES.filter(c => c !== city).sort(() => Math.random()-0.5).slice(0,2);
    clueList = [`Локация: ${city}`,"Архитектурный маркер","Транспортный узел","Рельеф","Время съёмки"];
  } else if (cat === "IMINT") {
    const plane = PLANES[id % PLANES.length];
    title = `IMINT · Борт ${String(id).padStart(3,"0")}`;
    brief = `Радар поймал неизвестный объект. Открой <span class="interactive" onclick="MG.imint('${plane}', ${clues})">телеметрию</span>.`;
    q = "Идентификация судна?";
    correct = plane;
    fakes = PLANES.filter(p => p !== plane).sort(() => Math.random()-0.5).slice(0,2);
    clueList = [`Модель: ${plane}`,"Сигнатура двигателя","Форма крыла","Скорость","Тепловой след"];
  } else if (cat === "HUMINT") {
    title = `HUMINT · Цель ${String(id).padStart(3,"0")}`;
    brief = `Профиль вызывает подозрения. Запусти <span class="interactive" onclick="MG.humint(${clues})">поведенческий анализ</span>.`;
    q = "Кто это?";
    correct = "Бот / Фейк";
    fakes = ["Реальный человек","Хакер-одиночка"];
    clueList = ["Текст сгенерирован ИИ","Аномальный паттерн","Нет реальных связей","Странная гео","Языковые маркеры"];
  } else {
    title = `OSINT · Утечка ${String(id).padStart(3,"0")}`;
    brief = `Обнаружен подозрительный источник. Проведи <span class="interactive" onclick="MG.osint(${clues})">разведку</span>.`;
    q = "Тип утечки?";
    correct = "База данных";
    fakes = ["Фишинг","Внутренний слив"];
    clueList = ["Источник: GitHub","Дата","Объём","Тип данных","Связанный домен"];
  }

  const answers = [
    {t: correct, ok: true},
    {t: fakes[0], ok: false},
    {t: fakes[1] || "Неизвестно", ok: false}
  ].sort(() => Math.random()-0.5);

  return {
    id, title, cat, diff, brief, q, answers,
    total: clues, clues: clueList.slice(0, clues),
    reward: { money: 180 + id*15 + (diff==="PRO"?250:0), rep: 10 + Math.floor(id/2), star: id%20===0 },
    story: false
  };
}

const STORY_TEMPLATES = [
  {
    title: "ПРОПАВШИЙ ПРОГРАММИСТ",
    cat: "OSINT", diff: "СЮЖЕТ",
    brief: "Программист Игорь исчез после странного сообщения. Найди 3 ключевые улики, чтобы понять, где он.",

      {id:3, text:"Последний пост: фото вывески «Склад №7»", ok:true},
      {id:4, text:"Профиль: увлекается рыбалкой", ok:false},
      {id:5, text:"Показания жены: он был расстроен", ok:false},
      {id:6, text:"Запись камеры: машина уехала на юг", ok:false}
    ],
    chat: [
      {s:"bot", t:"Бро, приходи на старый склад, там будет сюрприз!"},
      {s:"me", t:"Какой склад? Уточни."},
      {s:"bot", t:"Склад №7, у реки. Только никому не говори."}
    ],
    reward: {money: 1500, rep: 30, star: true}
  },
  {
    title: "ФЕЙКОВЫЙ ДИПЛОМАТ",
    cat: "HUMINT", diff: "СЮЖЕТ",
    brief: "Дипломат с подозрительной биографией. Найди 3 улики, чтобы доказать, что он использует чужое фото.",
    q: "Кто этот дипломат?",
    answers: [{t:"Актер с фотобанка",ok:true},{t:"Настоящий дипломат",ok:false},{t:"Хакер",ok:false}],
    clues: [
      {id:1, text:"Фото найдено на сайте актерского агентства", ok:true},
      {id:2, text:"Язык: смесь английского и французского без акцента", ok:true},
      {id:3, text:"Instagram: аккаунт создан 5 дней назад", ok:true},
      {id:4, text:"Посты: только репосты новостей", ok:false},
      {id:5, text:"Друзья: 0 человек", ok:false},
      {id:6, text:"Email: gmail.com", ok:false}
    ],
    chat: [
      {s:"bot", t:"Я дипломат из Франции. Приехал на переговоры."},
      {s:"me", t:"Где ваши верительные грамоты?"},
      {s:"bot", t:"Пришлю позже. Сейчас не до этого."}
    ],
    reward: {money: 2000, rep: 40, star: true}
  },
  {
    title: "УТЕЧКА В DARKNET",
    cat: "IMINT", diff: "СЮЖЕТ",
    brief: "Хакер продает базу данных. Найди 3 улики, чтобы понять, где он работает.",
    q: "Где работает хакер?",
    answers: [{t:"Индия (UTC+5:30)",ok:true},{t:"Россия (UTC+3)",ok:false},{t:"США (UTC-5)",ok:false}],
    clues: [
      {id:1, text:"Время активности: с 10:00 до 22:00 по местному", ok:true},
      {id:2, text:"Часовой пояс: UTC+5:30", ok:true},
      {id:3, text:"Язык постов: хинди и английский", ok:true},
      {id:4, text:"Никнейм: хакер_777", ok:false},
      {id:5, text:"Аватарка: маска", ok:false},
      {id:6, text:"Кошелек: Bitcoin", ok:false}
    ],
    chat: [
      {s:"bot", t:"Лот выставлен. Биткоин-кошелек в профиле."},
      {s:"me", t:"Ты в какой стране?"},
      {s:"bot", t:"Не твое дело. Но платить можно в любое время суток."}
    ],
    reward: {money: 2500, rep: 50, star: true}
  }
];

function makeStories() {
  const result = [];
  for (let i = 0; i < 120; i++) {
    const template = STORY_TEMPLATES[i % STORY_TEMPLATES.length];
    const storyId = 9000 + i + 1;
    result.push({
      id: storyId,
      title: template.title + " #" + (i + 1),
      cat: template.cat,
      diff: "СЮЖЕТ",
      story: true,
      brief: template.brief,
      q: template.q,
      answers: template.answers,
      total: 3,
      deduction: template.clues,
      chat: template.chat,
      reward: {
        money: template.reward.money + (i * 100),
        rep: template.reward.rep + (i * 5),
        star: true
      }
    });
  }
  return result;
}

const Deduction = {
  selected: new Set(),
  
  start(caseData) {
    this.selected.clear();
    this.caseData = caseData;
    this.render();
  },
  
  render() {
    const c = this.caseData;
    let html = `
      <div class="minigame fade">
        <div style="font-size:13px;font-weight:800;letter-spacing:1px;margin-bottom:8px;">ДЕДУКЦИЯ</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px;">Выбери 3 ключевые улики, чтобы раскрыть дело</div>
        <div style="display:flex;justify-content:center;gap:6px;margin-bottom:12px;">
          <div style="font-size:24px;font-weight:900;color:var(--primary);">${this.selected.size}</div>
          <div style="font-size:24px;font-weight:900;color:var(--muted);">/ 3</div>
        </div>
        <div style="text-align:left;">`;
    
    c.deduction.forEach((clue, index) => {
      const isSelected = this.selected.has(clue.id);
      html += `
        <div class="deduction-card ${isSelected ? 'selected' : ''}" 
             onclick="Deduction.toggle(${clue.id})">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:20px;height:20px;border-radius:50%;border:2px solid ${isSelected ? 'var(--primary)' : '#333'};display:flex;align-items:center;justify-content:center;font-size:12px;background:${isSelected ? 'var(--primary)' : 'transparent'};">
              ${isSelected ? '✓' : ''}
            </div>
            <div style="font-size:13px;">${clue.text}</div>
          </div>
        </div>`;
    });
    
    html += `</div>`;
    html += `
        <button class="btn btn-primary" style="margin-top:14px;" onclick="Deduction.check()">
          ПРОВЕРИТЬ
        </button>
      </div>`;
    
    App.browser(html);
  },
  
  toggle(id) {
    if (this.selected.has(id)) {
      this.selected.delete(id);
    } else {
      if (this.selected.size < 3) {
        this.selected.add(id);
      } else {
        tg.showAlert("Можно выбрать только 3 улики");
        return;
      }
    }
    this.render();
  },
  
  check() {
    if (this.selected.size < 3) {
      tg.showAlert("Выбери ровно 3 улики");
      return;
    }
    
    const c = this.caseData;
    let correctCount = 0;
    
    this.selected.forEach(id => {
      const clue = c.deduction.find(cl => cl.id === id);
      if (clue && clue.ok) correctCount++;
    });
    
    if (correctCount === 3) {
      Game.clue("Все улики верны! Дело раскрыто.");
      document.getElementById('finish').style.display = 'block';
      document.getElementById('sub').className = 'btn btn-danger';
      document.getElementById('sub').textContent = 'СДАТЬ ОТЧЁТ';
      document.getElementById('sub').disabled = false;
      tg.showAlert("Отлично! Все 3 улики верны. Теперь сдай отчёт.");
    } else {
      tg.showAlert(`Ошибка! Верных улик: ${correctCount} из 3. Попробуй снова.`);
      this.selected.clear();
      this.render();
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    }
  }
};

const Game = {
  init() {
    S.stories = makeStories();
    for (let i=1;i<=30;i++) S.cases.push(makeCase(i));
    App.render();
  },

  next() {
    const idx = Math.floor(S.p.base / 4);
    if (idx > S.p.story && S.p.story < S.stories.length) return S.stories[S.p.story];
    let c = S.cases.find(x => !S.p.done.includes(x.id));
    if (!c) {
      const start = S.cases.length + 1;
      for (let i=start;i<start+15;i++) S.cases.push(makeCase(i));
      c = S.cases.find(x => !S.p.done.includes(x.id));
    }
    return c;
  },

  start(id) {
    S.case = S.stories.find(c => c.id===id) || S.cases.find(c => c.id===id);
    S.found.clear();

    const c = S.case;
    const threat = c.diff === "PRO" || c.story;

    let html = `
      <div class="fade">
        <div class="header">
          <button class="back" onclick="S.tab='cases';App.render()">←</button>
          <div style="font-size:15px;font-weight:800;font-family:monospace;color:${c.story?'var(--gold)':'var(--primary)'};">
            ${c.story ? "СЮЖЕТ" : "ДЕЛО"} #${c.id}
          </div>
        </div>

        <div class="card ${threat ? "threat-high" : ""} ${c.story ? "story" : ""}">
          <span class="badge ${c.story ? "badge-gold" : threat ? "badge-red" : "badge-cyan"}">${c.cat} · ${c.diff}</span>
          <div style="font-size:14px;line-height:1.55;margin-top:10px;">${c.brief}</div>
          
          <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);">
            <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:0.6px;margin-bottom:6px;">
              <span>УЛИКИ</span>
              <span id="cc" style="color:var(--primary);">0 / ${c.total}</span>
            </div>
            <div class="progress"><div class="progress-bar" id="cp" style="width:0%"></div></div>
          </div>
        </div>

        <div id="browser" class="hidden"></div>

          <button class="btn btn-outline disabled" id="sub" onclick="Game.report()">НАЙДЕНО НЕ ВСЁ</button>
        </div>
      </div>`;

    document.getElementById("app").innerHTML = html;
    document.getElementById("nb").style.display = "flex";
    document.getElementById("nb").textContent = "📓 0";

    if (c.story) {
      let term = `
        <div class="terminal fade">
          <div class="terminal-bar">
            <div class="dot" style="background:#ff5f56"></div>
            <div class="dot" style="background:#ffbd2e"></div>
            <div class="dot" style="background:#27c93f"></div>
          </div>
          <div class="terminal-body">
            <div class="t-green">> ДЕШИФРОВКА КАНАЛА...</div>
          </div>
        </div>`;
      if (c.chat) {
        c.chat.forEach(m => {
          term += `<div class="bubble ${m.s}"><b>${m.s==="bot"?"ПОДОЗРЕВАЕМЫЙ":"АГЕНТ"}:</b> ${m.t}</div>`;
        });
      }
      App.browser(term);
      setTimeout(() => Deduction.start(c), 1000);
    } else {
      if (c.cat === "GEOINT") MG.geo(c.answers[0].t, c.total);
      else if (c.cat === "IMINT") MG.imint(c.answers[0].t, c.total);
      else if (c.cat === "HUMINT") MG.humint(c.total);
      else MG.osint(c.total);
    }

    if (S.has("Декодер") && Math.random() > 0.35) {
      setTimeout(() => Game.clue("Декодер: автоматическая улика"), 900);
    }
  },

  clue(text) {
    if (S.found.has(text)) return;
    S.found.add(text);
    S.p.clues++;

    const nb = document.getElementById("nb");
    const cc = document.getElementById("cc");
    const cp = document.getElementById("cp");
    if (nb) nb.textContent = `📓 ${S.found.size}`;
    if (cc) cc.textContent = `${S.found.size} / ${S.case.total}`;
    if (cp) cp.style.width = `${(S.found.size / S.case.total) * 100}%`;

    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  },

  report() {
    if (S.found.size < S.case.total) return;
    const c = S.case;
    document.getElementById("modal-body").innerHTML = `
      <div style="font-size:18px;font-weight:800;color:var(--danger);margin-bottom:6px;">ВЕРДИКТ</div>

        `).join("")}
      </div>`;
    document.getElementById("modal").classList.add("active");
  },

  answer(ok) {
    const body = document.getElementById("modal-body");
    const c = S.case;

    if (ok) {
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      S.p.money += c.reward.money;
      S.p.rep += c.reward.rep;

      let star = false;
      if (!S.p.done.includes(c.id)) {
        S.p.done.push(c.id);
        if (c.story) S.p.story++;
        else S.p.base++;
        if (c.reward.star) { S.p.stars++; star = true; }
        if (S.p.done.length % 5 === 0) S.p.level++;
      }
      S.save();

      body.innerHTML = `
        <div style="text-align:center;">
          <div style="font-size:48px;margin-bottom:6px;">✓</div>
          <div style="font-size:20px;font-weight:800;color:var(--success);margin-bottom:12px;">ДЕЛО ЗАКРЫТО</div>
          <div style="font-size:14px;margin-bottom:6px;">
            <span style="color:var(--primary);font-size:18px;font-weight:800;">+${c.reward.money} ₽</span>
          </div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">+${c.reward.rep} репутации</div>
          ${star ? `<div style="color:var(--gold);font-weight:800;margin-bottom:12px;">★ ПОЛУЧЕНА ЗВЕЗДА</div>` : ""}
          <button class="btn btn-primary" onclick="document.getElementById('modal').classList.remove('active');S.tab='cases';App.render()">ПРОДОЛЖИТЬ</button>
        </div>`;
    } else {
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
      const penalty = S.has("Стелс-пакет") ? 6 : 14;
      S.p.rep = Math.max(0, S.p.rep - penalty);
      S.save();
      body.innerHTML = `
        <div style="text-align:center;">
          <div style="font-size:48px;margin-bottom:6px;">✕</div>
          <div style="font-size:20px;font-weight:800;color:var(--danger);margin-bottom:12px;">ОШИБКА</div>
          <div style="font-size:14px;color:var(--muted);margin-bottom:18px;">−${penalty} репутации</div>
          <button class="btn btn-outline" onclick="document.getElementById('modal').classList.remove('active')">ПОПРОБОВАТЬ СНОВА</button>
        </div>`;
    }
  }
};

              <div>
                <div style="font-size:15px;font-weight:800;">${name}</div>
                <div style="font-size:12px;color:var(--muted);">${t.desc}</div>
              </div>
            </div>
            <button class="btn ${owned ? "disabled" : "btn-primary"}" onclick="App.buy('${name}',${t.price})">
              ${owned ? "✓ КУПЛЕНО" : `КУПИТЬ · ${t.price} ₽`}
            </button>
          </div>`;
      }
      html += `</div>`;
      app.innerHTML = html;
    }

    else if (S.tab === "agent") {
      const rank = S.p.level < 5 ? "СТАЖЁР" : S.p.level < 12 ? "АНАЛИТИК" : S.p.level < 22 ? "СПЕЦИАЛИСТ" : "ТЕНЕВОЙ ОПЕРАТОР";
      app.innerHTML = `
        <div class="fade">
          <div style="font-size:22px;font-weight:800;margin-bottom:16px;">ДОСЬЕ АГЕНТА</div>
          
          <div class="card" style="text-align:center;padding:28px 18px;">
            <div style="width:84px;height:84px;border-radius:50%;border:2px solid var(--primary);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:var(--glow);background:#0a0f18;">
              🕵
            </div>
            <div style="font-family:monospace;color:var(--primary);font-size:15px;font-weight:700;">
              ID: ${tg.initDataUnsafe?.user?.id || "008"}
            </div>
            <div style="font-size:13px;font-weight:800;letter-spacing:1.5px;margin-top:4px;">${rank}</div>
          </div>

          <div class="card">
            <div class="stats">
              <div class="stat"><span class="icon">💰</span><span class="val">${S.p.money}</span></div>
              <div class="stat"><span class="icon">🎖</span><span class="val">${S.p.rep}</span></div>
              <div class="stat"><span class="icon">★</span><span class="val">${S.p.stars}</span></div>
            </div>
            <div style="font-size:11px;color:var(--muted);letter-spacing:0.8px;font-weight:700;margin:16px 0 8px;">ИНВЕНТАРЬ</div>
            <div style="font-size:13px;color:var(--primary);">
              ${S.p.tools.length ? S.p.tools.join(" · ") : "Пусто"}
            </div>
          </div>
        </div>`;
    }
  },

  buy(name, price) {
    if (S.p.money >= price) {
      S.p.money -= price;
      S.p.tools.push(name);
      S.save();
      this.render();
      tg.showAlert(`Приобретено: ${name}`);
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    } else {
      tg.showAlert("Недостаточно средств");
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    }
  },

  browser(html) {
    const el = document.getElementById("browser");
    if (el) {
      el.innerHTML = html;
      el.classList.remove("hidden");
    }
    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred("rigid");
  },

  notebook() {
    const clues = [...S.found];
    document.getElementById("modal-body").innerHTML = `
      <div style="font-size:17px;font-weight:800;color:var(--primary);margin-bottom:14px;">
        УЛИКИ ${clues.length}/${S.case?.total || 0}
      </div>
      <div style="max-height:240px;overflow-y:auto;margin-bottom:16px;">
        ${clues.length ? clues.map(c => `<div class="clue-item">✓ ${c}</div>`).join("") : 
          `<div style="color:var(--muted);font-size:13px;">Пока пусто</div>`}
      </div>
      <button class="btn btn-outline" onclick="document.getElementById('modal').classList.remove('active')">ЗАКРЫТЬ</button>`;
    document.getElementById("modal").classList.add("active");
  }
};

Game.init();
</script>
</body>
</html>
