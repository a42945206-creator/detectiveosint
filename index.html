<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OSINT: Dark Web Detective</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #05070a; --text: #e2e8f0; --hint: #64748b; --primary: #00ffcc; --secondary: #ff0055;
            --card-bg: rgba(15, 23, 42, 0.8); --glass-border: rgba(0, 255, 204, 0.2);
            --success: #00ff66; --danger: #ff3333; --gold: #ffd700;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px); background-size: 30px 30px; }
        ::-webkit-scrollbar { width: 0px; }
        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; scroll-behavior: smooth; }

        /* Навигация */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--glass-border); z-index: 90; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--hint); font-size: 10px; font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); letter-spacing: 1px; }
        .nav-item.active { color: var(--primary); transform: translateY(-3px); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; transition: 0.3s; }
        .nav-item.active .nav-icon { filter: drop-shadow(0 0 8px var(--primary)); }

        /* Карточки и кнопки */
        .card { background: var(--card-bg); border: 1px solid var(--glass-border); padding: 20px; border-radius: 20px; margin-bottom: 16px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); transition: transform 0.2s; position: relative; overflow: hidden; }
        .card:active { transform: scale(0.98); }
        .btn { background: linear-gradient(135deg, var(--primary), #00b3ff); color: #000; border: none; padding: 16px; border-radius: 16px; font-size: 15px; font-weight: 900; cursor: pointer; width: 100%; transition: all 0.2s; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2); display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:active { transform: scale(0.96); }
        .btn-outline { background: transparent; border: 2px solid var(--glass-border); color: var(--text); box-shadow: none; }
        .btn-danger { background: linear-gradient(135deg, var(--secondary), #ff5500); color: white; box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3); }
        .btn-success { background: linear-gradient(135deg, var(--success), #00b3ff); color: white; box-shadow: 0 4px 15px rgba(0, 255, 102, 0.3); }
        .btn-disabled { background: #1a1a1a; color: #444; pointer-events: none; box-shadow: none; border: 1px solid #333; }

        h1, h2, h3 { margin: 0 0 15px 0; font-weight: 800; letter-spacing: -0.5px; }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 8px; font-size: 10px; font-weight: 900; background: rgba(0, 255, 204, 0.1); color: var(--primary); text-transform: uppercase; letter-spacing: 1px; border: 1px solid rgba(0, 255, 204, 0.2); margin-bottom: 10px; }
        .badge-hard { background: rgba(255, 0, 85, 0.1); color: var(--secondary); border-color: rgba(255,0,85,0.2); }
        .badge-gold { background: rgba(255, 215, 0, 0.1); color: var(--gold); border-color: rgba(255,215,0,0.2); }

        .progress-container { margin-top: 15px; }
        .progress-bg { height: 8px; background: #111; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); width: 0%; transition: width 0.8s ease-in-out; box-shadow: 0 0 10px var(--primary); }

        /* Терминал */
        .app-header { display: flex; align-items: center; margin-bottom: 20px; gap: 15px; }
        .back-btn { background: transparent; border: none; color: var(--primary); font-size: 28px; cursor: pointer; padding: 0; text-shadow: 0 0 10px var(--primary); }
        .terminal-window { background: #000; border: 1px solid #222; border-radius: 12px; overflow: hidden; margin-bottom: 15px; font-family: 'Courier New', Courier, monospace; }
        .terminal-header { background: #111; padding: 8px 12px; display: flex; gap: 6px; border-bottom: 1px solid #222; }
        .terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
        .terminal-body { padding: 15px; font-size: 13px; line-height: 1.6; color: #ccc; }
        .terminal-line { margin-bottom: 5px; }
        .term-green { color: var(--primary); }

        .interactive { cursor: pointer; border-bottom: 1px dashed var(--primary); color: var(--primary); display: inline-block; transition: 0.2s; font-weight: bold; }
        .interactive:active { background: rgba(0,255,204,0.2); }
        .interactive.found { color: var(--hint); border-bottom: none; text-decoration: line-through; pointer-events: none; }

        /* Блокнот */
        .notebook-toggle { position: fixed; bottom: 90px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--primary); color: var(--primary); font-size: 24px; box-shadow: 0 0 20px rgba(0, 255, 204, 0.3); z-index: 51; display: none; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(10px); }
        .clue-item { font-size: 13px; margin-bottom: 8px; color: var(--success); background: rgba(0, 255, 102, 0.1); padding: 12px; border-radius: 8px; border-left: 3px solid var(--success); display: flex; align-items: center; gap: 10px; }

        /* Модалки */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal { background: #0a0f18; border: 1px solid var(--primary); padding: 25px; border-radius: 24px; width: 100%; max-width: 400px; transform: scale(0.8) translateY(20px); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 50px rgba(0, 255, 204, 0.15); }
        .modal-overlay.active .modal { transform: scale(1) translateY(0); }

        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>

    <div class="content" id="main-content"></div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('cases', this)"><div class="nav-icon">🗂️</div><div>КЕЙСЫ</div></div>
        <div class="nav-item" onclick="switchTab('shop', this)"><div class="nav-icon">🛒</div><div>РЫНОК</div></div>
        <div class="nav-item" onclick="switchTab('profile', this)"><div class="nav-icon">👤</div><div>АГЕНТ</div></div>
    </div>

    <button class="notebook-toggle" id="notebook-btn" onclick="toggleNotebook()">📓</button>
    <div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        if (tg.setHeaderColor) tg.setHeaderColor('#05070a');
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

        const CATEGORIES = ["OSINT", "GEOINT", "IMINT", "HUMINT"];
        const CITIES = ["Токио", "Лондон", "Нью-Йорк", "Дубай", "Сингапур", "Париж", "Москва", "Сеул", "Сидней", "Берлин"];
        const PLANES = ["Boeing 777", "Airbus A380", "F-22 Raptor", "Су-57", "Ан-225", "B-2 Spirit"];
        const NAMES = ["Алекс", "Мария", "Джон", "Сара", "Иван", "Чен"];

        // ГЕНЕРАТОР 350 СЮЖЕТНЫХ КЕЙСОВ
        let STORY_CASES = [];
        function generateStoryCases() {
            for(let i=1; i<=350; i++) {
                const isGeo = i % 2 === 0;
                const city = CITIES[i % CITIES.length];
                const name = NAMES[i % NAMES.length];
                
                let title, brief, q, ans, fake1, fake2, clues = 3;

                if (isGeo) {
                    title = `СЮЖЕТ #${i}: Пропавший груз`;
                    brief = `Контрабандисты спрятали груз. Найди точку. Изучи <span class='interactive' onclick='openGeoEvidence("${city}", ${clues})'>спутниковый снимок</span>.`;
                    q = "В каком городе спрятан груз?";
                    ans = city;
                    fake1 = CITIES[(i+1) % CITIES.length];
                    fake2 = CITIES[(i+2) % CITIES.length];
                } else {
                    title = `СЮЖЕТ #${i}: Двойной агент`;
                    brief = `Подозреваемый в утечке данных. Найди его реальную личность. Изучи <span class='interactive' onclick='openHumanEvidence("${name}", ${clues})'>цифровой профиль</span>.`;
                    q = "Кто на самом деле этот агент?";
                    ans = "Это бот / фейк";
                    fake1 = "Реальный человек";
                    fake2 = "Сотрудник спецслужб";
                }

                let answers = [
                    { t: ans, correct: true },
                    { t: fake1, correct: false },
                    { t: fake2, correct: false }
                ].sort(() => 0.5 - Math.random());

                STORY_CASES.push({
                    id: 1000 + i, isStory: true, title: title, category: isGeo ? "GEOINT" : "HUMINT", difficulty: "СЮЖЕТ",
                    brief: brief, questions: [{ text: q, answers: answers }],
                    totalClues: clues, reward: { money: 500 + (i * 10), rep: 10 + (i * 2), stars: i % 10 === 0 ? 1 : 0 }
                });
            }
        }

        let CASES_DB = [];

        function generateCases() {
            for (let i = 1; i <= 700; i++) {
                const cat = CATEGORIES[i % CATEGORIES.length];
                const clueCount = Math.floor(Math.random() * 9) + 2;
                let title, brief, qText, correctAnswer, fakeAnswers = [], clues = [];

                if (cat === "GEOINT") {
                    const city = CITIES[Math.floor(Math.random() * CITIES.length)];
                    title = `GEOINT: Сектор ${i}`;
                    brief = `Определи точку съемки. Доступ к <span class='interactive' onclick='openGeoEvidence("${city}", ${clueCount})'>спутниковому снимку</span>.`;
                    qText = "Какой город на снимке?";
                    correctAnswer = city;
                    fakeAnswers = CITIES.filter(c => c !== city).sort(() => 0.5 - Math.random()).slice(0, 2);
                    for(let j=1; j<clueCount; j++) clues.push(`Архитектурный маркер #${j}`);
                    clues[0] = `Город: ${city}`;
                } 
                else if (cat === "IMINT") {
                    const plane = PLANES[Math.floor(Math.random() * PLANES.length)];
                    title = `IMINT: Борт ${i}`;
                    brief = `Радар засек цель. Открой <span class='interactive' onclick='openPlaneEvidence("${plane}", ${clueCount})'>данные телеметрии</span>.`;
                    qText = "Идентифицируй воздушное судно:";
                    correctAnswer = plane;
                    fakeAnswers = PLANES.filter(p => p !== plane).sort(() => 0.5 - Math.random()).slice(0, 2);
                    for(let j=1; j<clueCount; j++) clues.push(`Данные двигателя #${j}`);
                    clues[0] = `Модель: ${plane}`;
                }
                else {
                    const name = NAMES[Math.floor(Math.random() * NAMES.length)];
                    title = `HUMINT: Цель ${i}`;
                    brief = `Проверь личность. Собери всю инфу. Изучи <span class='interactive' onclick='openHumanEvidence("${name}", ${clueCount})'>цифровой профиль</span>.`;
                    qText = "Твой вывод по цели?";
                    correctAnswer = "Бот / Фейк";
                    fakeAnswers = ["Реальный человек"];
                    for(let j=1; j<clueCount; j++) clues.push(`Подозрительный паттерн #${j}`);
                    clues[0] = "Текст сгенерирован ИИ";
                }

                let answers = [
                    { t: correctAnswer, correct: true },
                    { t: fakeAnswers[0], correct: false },
                    { t: fakeAnswers[1] || "Неизвестно", correct: false }
                ].sort(() => 0.5 - Math.random());

                CASES_DB.push({
                    id: i, title: title, category: cat, difficulty: i > 400 ? "PRO" : "MID",
                    brief: brief, questions: [{ text: qText, answers: answers }],
                    totalClues: clueCount, clueTexts: clues,
                    reward: { money: 100 + (i * 10), rep: 5 + (i * 2), stars: i % 40 === 0 ? 1 : 0 }
                });
            }
        }

        // Загружаем базу
        let player = JSON.parse(localStorage.getItem('osint_pro_v8')) || { 
            money: 500, reputation: 0, stars: 0, level: 1, tools: [], completedCases: [], baseCasesDone: 0
        };
        
        if (CASES_DB.length === 0) generateCases(); 
        if (STORY_CASES.length === 0) generateStoryCases(); 

        let currentTab = 'cases';
        let activeCase = null;
        let foundClues = new Set();

        function save() { localStorage.setItem('osint_pro_v8', JSON.stringify(player)); }

        function render() {
            const content = document.getElementById('main-content');
            
            if (currentTab === 'cases') {
                let nextCase = null;
                let isStoryNext = false;

                // Логика выдачи кейсов (Сюжет выпадает каждые 3-5 базовых)
                const nextStoryIndex = Math.floor(player.baseCasesDone / 4); // примерно каждые 4 кейса
                const storiesLeft = player.storyDone || 0;

                if (nextStoryIndex > storiesLeft && storiesLeft < STORY_CASES.length) {
                    nextCase = STORY_CASES[storiesLeft];
                    isStoryNext = true;
                } else {
                    nextCase = CASES_DB.find(c => !player.completedCases.includes(c.id)) || CASES_DB[0];
                }
                
                content.innerHTML = `
                    <div class="animate">
                        <h1 style="font-size:24px;">🛰 ОПЕРАТИВНЫЙ ШТАБ</h1>
                        <div class="card">
                            <h3>УРОВЕНЬ ДОПУСКА: <span style="color:var(--primary)">${player.level}</span></h3>
                            <div class="progress-container">
                                <div class="progress-bg"><div class="progress-fill" style="width: ${(player.completedCases.length % 5) * 20}%"></div></div>
                            </div>
                            <p style="font-size:11px; color:var(--hint); margin-top:8px; font-weight:800; text-transform:uppercase; letter-spacing:1px;">Архив: ${player.completedCases.length} дел</p>
                        </div>

                        <div class="card" style="border-color: ${nextCase.isStory ? 'var(--gold)' : 'rgba(0, 255, 204, 0.5)'}; box-shadow: 0 0 20px ${nextCase.isStory ? 'rgba(255,215,0,0.15)' : 'rgba(0,255,204,0.1)'};">
                            ${nextCase.isStory ? '<span class="badge badge-gold">🌟 СЮЖЕТНАЯ МИССИЯ</span>' : '<span class="badge">ВХОДЯЩИЙ ЗАПРОС</span>'}
                            <h2 style="font-size:18px; margin-bottom:5px;">${nextCase.title}</h2>
                            <p style="font-size:11px; color:var(--hint); margin-bottom:15px; text-transform:uppercase; letter-spacing:1px;">${nextCase.category} • ${nextCase.difficulty}</p>
                            <button class="btn" onclick="startCase(${nextCase.id})">ОТКРЫТЬ ДЕЛО</button>
                        </div>
                    </div>
                `;
            } 
            else if (currentTab === 'shop') {
                const hasRev = player.tools.includes('Reverse Image');
                const hasBot = player.tools.includes('Анти-бот');
                const hasGeo = player.tools.includes('Гео-модуль');

                content.innerHTML = `
                    <div class="animate">
                        <h1>🛒 ЧЕРНЫЙ РЫНОК</h1>
                        <div class="card">
                            <h3>🖼 Reverse Image (1000 ₽)</h3>
                            <p style="font-size:12px; color:var(--hint);">Помогает в кейсах HUMINT.</p>
                            <button class="btn ${hasRev ? 'btn-disabled' : ''}" onclick="buyTool('Reverse Image', 1000)">
                                ${hasRev ? '✅ КУПЛЕНО' : 'КУПИТЬ'}
                            </button>
                        </div>
                        <div class="card">
                            <h3>🧠 Анти-бот (1500 ₽)</h3>
                            <p style="font-size:12px; color:var(--hint);">Подсвечивает ответ в HUMINT.</p>
                            <button class="btn ${hasBot ? 'btn-disabled' : ''}" onclick="buyTool('Анти-бот', 1500)">
                                ${hasBot ? '✅ КУПЛЕНО' : 'КУПИТЬ'}
                            </button>
                        </div>
                        <div class="card">
                            <h3>🗺 Гео-модуль (2000 ₽)</h3>
                            <p style="font-size:12px; color:var(--hint);">Подсказка в GEOINT.</p>
                            <button class="btn ${hasGeo ? 'btn-disabled' : ''}" onclick="buyTool('Гео-модуль', 2000)">
                                ${hasGeo ? '✅ КУПЛЕНО' : 'КУПИТЬ'}
                            </button>
                        </div>
                    </div>
                `;
            }
            else if (currentTab === 'profile') {
                const rank = player.level < 5 ? 'СТАЖЕР' : player.level < 15 ? 'АНАЛИТИК' : player.level < 30 ? 'СПЕЦИАЛИСТ' : 'ТЕНЕВОЙ АРХИТЕКТОР';
                content.innerHTML = `
                    <div class="animate">
                        <h1>👤 ДОСЬЕ АГЕНТА</h1>
                        <div class="card" style="text-align:center; padding:30px 20px; background: linear-gradient(180deg, rgba(15,23,42,1) 0%, rgba(0,255,204,0.05) 100%);">
                            <div style="width:100px; height:100px; background:#111; border-radius:50%; border: 2px solid var(--primary); margin: 0 auto 15px; display:flex; justify-content:center; align-items:center; font-size:40px; box-shadow: 0 0 20px rgba(0,255,204,0.3);">🕵️</div>
                            <h2 style="color:var(--primary); font-family:monospace;">ID: ${tg.initDataUnsafe?.user?.id || '008'}</h2>
                            <p style="color:var(--text); font-weight:900; letter-spacing:2px; margin-top:5px; font-size:14px;">${rank}</p>
                        </div>
                        <div class="card">
                            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-bottom:15px; text-align:center;">
                                <div style="background:rgba(0,0,0,0.3); padding:10px; border-radius:10px;"><span style="font-size:20px;">💰</span><br><b style="font-size:14px;">${player.money} ₽</b></div>
                                <div style="background:rgba(0,0,0,0.3); padding:10px; border-radius:10px;"><span style="font-size:20px;">🎖</span><br><b style="font-size:14px;">${player.reputation}</b></div>
                                <div style="background:rgba(0,0,0,0.3); padding:10px; border-radius:10px;"><span style="font-size:20px;">⭐</span><br><b style="font-size:14px;">${player.stars}</b></div>
                            </div>
                            <h3 style="font-size:11px; margin-top:20px; color:var(--hint); letter-spacing:1px;">ИНВЕНТАРЬ</h3>
                            <p style="font-size:13px; color:var(--primary);">${player.tools.length ? player.tools.join(', ') : 'Нет тулзов'}</p>
                        </div>
                    </div>
                `;
            }
        }

        function switchTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            render();
            document.getElementById('notebook-btn').style.display = 'none';
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('soft');
        }

        function buyTool(name, price) {
            if (player.money >= price) {
                player.money -= price;
                player.tools.push(name);
                save();
                render();
                tg.showAlert(`Успешно куплено: ${name}!`);
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                tg.showAlert("Недостаточно средств!");
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        function startCase(id) {
            activeCase = STORY_CASES.find(c => c.id === id) || CASES_DB.find(c => c.id === id);
            foundClues.clear();
            
            document.getElementById('main-content').innerHTML = `
                <div class="animate">
                    <div class="app-header">
                        <button class="back-btn" onclick="currentTab='cases'; render();">←</button>
                        <h2 style="font-size:18px; margin:0; font-family:monospace; color:${activeCase.isStory ? 'var(--gold)' : 'var(--primary)'};">ДЕЛО #${activeCase.id}</h2>
                    </div>
                    <div class="card" style="border-left: 4px solid ${activeCase.isStory ? 'var(--gold)' : 'var(--secondary)'};">
                        <span class="badge ${activeCase.isStory ? 'badge-gold' : 'badge-hard'}">${activeCase.category}</span>
                        <p style="font-size:14px; margin-top:10px; line-height:1.5;">${activeCase.brief}</p>
                        
                        <div style="margin-top:15px; padding-top:15px; border-top:1px solid var(--glass-border);">
                            <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold; margin-bottom:5px;">
                                <span>СОБРАНО УЛИК:</span>
                                <span id="clue-counter" style="color:var(--primary)">0 / ${activeCase.totalClues}</span>
                            </div>
                            <div class="progress-bg"><div class="progress-fill" id="clue-progress" style="width: 0%"></div></div>
                        </div>
                    </div>
                    
                    <div id="browser-view" class="hidden">
                        <div id="browser-content"></div>
                    </div>
                    
                    <div id="finish-section" style="margin-top:20px; display:none;">
                        <button class="btn btn-disabled" id="submit-btn" onclick="openReport()">⚠️ НАЙДЕНО НЕ ВСЁ</button>
                    </div>
                </div>
            `;
            document.getElementById('notebook-btn').style.display = 'flex';
            document.getElementById('notebook-btn').innerText = `📓 0`;
        }

        function showBrowser(html) {
            document.getElementById('browser-content').innerHTML = html;
            document.getElementById('browser-view').classList.remove('hidden');
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('rigid');
        }

        function addClue(text) {
            if (foundClues.has(text)) return;
            foundClues.add(text);
            
            document.getElementById('notebook-btn').innerText = `📓 ${foundClues.size}`;
            document.getElementById('clue-counter').innerText = `${foundClues.size} / ${activeCase.totalClues}`;
            document.getElementById('clue-progress').style.width = `${(foundClues.size / activeCase.totalClues) * 100}%`;
            
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            const finishSection = document.getElementById('finish-section');
            const submitBtn = document.getElementById('submit-btn');
            finishSection.style.display = 'block';

            if (foundClues.size >= activeCase.totalClues) {
                submitBtn.className = 'btn btn-danger animate';
                submitBtn.innerText = '🚨 СДАТЬ ОТЧЁТ';
            } else {
                submitBtn.className = 'btn btn-disabled';
                submitBtn.innerText = `⚠️ НАЙДЕНО ${foundClues.size} ИЗ ${activeCase.totalClues}`;
            }
            
            toggleNotebook();
        }

        // --- ДОКАЗАТЕЛЬСТВА ---
        function openGeoEvidence(city, total) {
            const geoHint = player.tools.includes('Гео-модуль') 
                ? `<p style="color:var(--primary); font-size:12px; margin-bottom:10px;">[ГЕО-МОДУЛЬ]: Город: <span class="interactive found">${city}</span></p>` 
                : `<p style="font-size:13px; line-height:1.6;">Спутник зафиксировал локацию: <span class="interactive" onclick="addClue('Город: ${city}')">${city}</span></p>`;
            let extraClues = '';
            for(let i=1; i<total; i++) extraClues += `<p style="font-size:13px; margin-bottom:10px; cursor:pointer;" onclick="addClue('Архитектурный маркер #${i}')"><span class="interactive">Скрытая деталь #${i}</span> (обработать)</p>`;
            showBrowser(`<div class="terminal-window"><div class="terminal-header"><div class="terminal-dot" style="background:#ff5f56"></div><div class="terminal-dot" style="background:#ffbd2e"></div><div class="terminal-dot" style="background:#27c93f"></div></div><div class="terminal-body"><div class="terminal-line term-green">> ЗАПУСК GEOINT...</div></div></div><div class="card" style="background:#0f172a; padding:15px;">${geoHint}${extraClues}</div>`);
        }

        function openPlaneEvidence(plane, total) {
            let extraClues = '';
            for(let i=1; i<total; i++) extraClues += `<p style="font-size:13px; margin-bottom:10px; cursor:pointer;" onclick="addClue('Характеристика ${i}')"><span class="interactive">Данные двигателя #${i}</span> (обработать)</p>`;
            showBrowser(`<div class="terminal-window"><div class="terminal-header"><div class="terminal-dot" style="background:#ff5f56"></div><div class="terminal-dot" style="background:#ffbd2e"></div><div class="terminal-dot" style="background:#27c93f"></div></div><div class="terminal-body"><div class="terminal-line term-green">> РАДАР АКТИВЕН...</div></div></div><div class="card" style="background:#0f172a; padding:15px;"><p style="font-size:13px; line-height:1.6;">Модель: <span class="interactive" onclick="addClue('Модель: ${plane}')">${plane}</span></p>${extraClues}</div>`);
        }

        function openHumanEvidence(name, total) {
            const botHint = player.tools.includes('Анти-бот') 
                ? `<p style="color:var(--primary); font-size:12px; margin-bottom:10px;">[АНТИ-БОТ]: Это <span class="interactive found">бот</span></p>` 
                : `<p style="font-size:13px; line-height:1.6;">Анализ: <span class="interactive" onclick="addClue('Текст сгенерирован ИИ')">неестественные паттерны речи</span></p>`;
            let extraClues = '';
            for(let i=1; i<total; i++) extraClues += `<div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #222; cursor:pointer;" onclick="addClue('Подозрительный паттерн #${i}')"><span style="font-size:13px;">Пост #${i}</span><span class="interactive" style="font-size:12px;">Анализ</span></div>`;
            showBrowser(`<div class="card" style="background:#0f172a; padding:15px;"><div style="display:flex; gap:15px; align-items:center; margin-bottom:15px;"><div style="width:50px; height:50px; background:linear-gradient(135deg, var(--primary), var(--secondary)); border-radius:50%; display:flex; justify-content:center; align-items:center; font-size:20px;">👤</div><div><p style="margin:0; font-weight:bold; font-size:15px;">${name}</p></div></div>${botHint}${extraClues}</div>`);
        }

        function toggleNotebook() {
            const modal = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.innerHTML = `<h2 style="color:var(--primary);">📓 УЛИКИ (${foundClues.size}/${activeCase.totalClues})</h2><div style="margin-bottom:20px; max-height:200px; overflow-y:auto;">${Array.from(foundClues).map(c => `<div class="clue-item">✅ ${c}</div>`).join('') || '<p style="color:var(--hint);">Пока пусто...</p>'}</div><button class="btn btn-outline" onclick="document.getElementById('modal-overlay').classList.remove('active')">ЗАКРЫТЬ</button>`;
            modal.classList.add('active');
        }

        function openReport() {
            if (foundClues.size < activeCase.totalClues) return;
            const modal = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.innerHTML = `<h2 style="color:var(--secondary);">ВЕРДИКТ</h2><p style="font-size:14px; margin-bottom:20px; color:var(--hint);">${activeCase.questions[0].text}</p><div style="display:flex; flex-direction:column; gap:10px;">${activeCase.questions[0].answers.map(a => `<button class="btn ${a.correct ? 'btn-success' : 'btn-outline'}" onclick="submitAnswer(${a.correct})">${a.t}</button>`).join('')}</div>`;
            modal.classList.add('active');
        }

        function submitAnswer(isCorrect) {
            const modal = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            if (isCorrect) {
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                player.money += activeCase.reward.money;
                player.reputation += activeCase.reward.rep;
                
                let gotStar = false;
                if (!player.completedCases.includes(activeCase.id)) {
                    player.completedCases.push(activeCase.id);
                    
                    if (activeCase.isStory) {
                        player.storyDone = (player.storyDone || 0) + 1;
                    } else {
                        player.baseCasesDone = (player.baseCasesDone || 0) + 1;
                    }

                    if (player.completedCases.length % 40 === 0) { player.stars += 1; gotStar = true; }
                    if (player.completedCases.length % 5 === 0) player.level++;
                }
                save();
                
                content.innerHTML = `<div style="text-align:center;"><div style="font-size:60px; margin-bottom:10px;">✅</div><h2 style="color:var(--success);">ДЕЛО ЗАКРЫТО</h2><p style="font-size:14px; margin:15px 0;">Награда:<br><b style="color:var(--primary); font-size:18px;">+${activeCase.reward.money} ₽</b></p>${gotStar ? '<p style="color:var(--gold); font-size:18px; font-weight:bold;">🌟 ЗВЕЗДА! 🌟</p>' : ''}<button class="btn" style="margin-top:20px;" onclick="document.getElementById('modal-overlay').classList.remove('active'); currentTab='cases'; render();">ПРОДОЛЖИТЬ</button></div>`;
            } else {
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                player.reputation = Math.max(0, player.reputation - 10);
                save();
                content.innerHTML = `<div style="text-align:center;"><div style="font-size:60px; margin-bottom:10px;">❌</div><h2 style="color:var(--danger);">ОШИБКА</h2><p style="font-size:14px; color:var(--hint); margin:15px 0;">-10 репутации.</p><button class="btn btn-outline" style="margin-top:10px;" onclick="document.getElementById('modal-overlay').classList.remove('active')">ПОПРОБОВАТЬ СНОВА</button></div>`;
            }
        }

        render();
    </script>
</body>
</html>
